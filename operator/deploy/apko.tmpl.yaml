contents:
  repositories:
    - https://apk.cve0.io
    - ./packages/
  keyring:
    - https://apk.cve0.io/key/cve0-signing.rsa.pub
    - ./melange.rsa.pub
  packages:
    - ec-operator  # This is expected to be built locally by `melange`.
    - ca-certificates-bundle
    - helm-4

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  VERSION: ${PACKAGE_VERSION}

entrypoint:
  command: /manager
