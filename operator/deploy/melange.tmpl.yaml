package:
  name: ec-operator
  version: "0.0.1" # our versioning is not compatible with apk
  epoch: 0
  description: Embedded Cluster Operator
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://apk.cve0.io
    keyring:
      - https://apk.cve0.io/key/cve0-signing.rsa.pub
    packages:
      - busybox
      - build-base
      - bash
      - go
      - git
      - ca-certificates-bundle
  environment:
    GOCACHE: /cache/melange/gocache
    GOMODCACHE: /cache/melange/gomodcache
    VERSION: ${PACKAGE_VERSION}
    K0S_MINOR_VERSION: ${K0S_MINOR_VERSION}
    GOPROXY: 'https://proxy.golang.org,direct'
    GOSUMDB: 'sum.golang.org'

pipeline:
  - runs: |
      set -exuo pipefail

      make -C operator build
      cp operator/bin/manager "${{targets.contextdir}}/manager"
  - uses: strip
