global:
  enableReplication: true
  replicationPlacment: "001"

master:
{{- if .ReplaceImages }}
  imageOverride: '{{ ImageString (index .Images "seaweedfs") }}'
{{- end }}
  replicas: 3
  nodeSelector: ~
  disableHttp: true
  volumeSizeLimitMB: 30000
  raftHashicorp: true
  raftBootstrap: true # masters would crash when raftHashicorp=true and raftBootstrap=false
  data:
    hostPathPrefix: "/var/lib/embedded-cluster/seaweedfs/ssd"
  logs:
    hostPathPrefix: "/var/lib/embedded-cluster/seaweedfs/storage"
  podAnnotations:
    # masters read [master.maintenance] scripts once at boot and the chart has no config
    # checksum on the master pod template, so a scripts change alone does not restart
    # running masters. bump this value whenever the maintenance scripts below change to
    # force a master rollout on upgrade.
    embedded-cluster.replicated.com/maintenance-scripts-revision: "1"
  affinity: |
    # schedule on control-plane nodes
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
    # schedule on different nodes when possible
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - seaweedfs
            - key: app.kubernetes.io/component
              operator: In
              values:
              - master
          topologyKey: "kubernetes.io/hostname"
  config: |-
    [master.maintenance]
    # periodically run these scripts are the same as running them from 'weed shell'
    # note: running 'fs.meta.save' then 'fs.meta.load' will ensure metadata of all filers
    # are in sync in case of data loss from 1 or more filers
    # note: each 'fs.meta.load' journals a full metadata snapshot to the filer change log
    # under /topics/.system/log; 'fs.log.purge' caps that log at 7 days so it does not
    # grow unbounded. nothing in embedded-cluster consumes the change log.
    # note: 's3.clean.uploads' aborts registry multipart uploads older than 24h; interrupted
    # image pushes otherwise leave fragments under /buckets/registry/.uploads forever.
    # registry pushes are node-local, so any upload older than 24h is abandoned.
    scripts = """
      ec.encode -fullPercent=95 -quietFor=1h
      ec.rebuild -force
      ec.balance -force
      volume.balance -force
      volume.configure.replication -replication 001 -collectionPattern *
      volume.fix.replication
      fs.meta.save -o filer-backup.meta
      fs.meta.load filer-backup.meta
      fs.log.purge -daysAgo 7
      s3.clean.uploads -timeAgo=24h
    """
    sleep_minutes = 17          # sleep minutes between each script execution
  resources:
    requests:
      cpu: "500m" # reserved cpu to prevent raft timeouts due to resource contention

volume:
  # replicas must be at least replication (2) + 1 = 3
  replicas: 3
  nodeSelector: ~
  minFreeSpacePercent: 1
{{- if .ReplaceImages }}
  imageOverride: '{{ ImageString (index .Images "seaweedfs") }}'
{{- end }}
  affinity: |
    # schedule on control-plane nodes
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
    # schedule on different nodes when possible
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - seaweedfs
            - key: app.kubernetes.io/component
              operator: In
              values:
              - volume
          topologyKey: "kubernetes.io/hostname"
  dataDirs:
  - name: data
    type: "persistentVolumeClaim"
    # openebs-hostpath storage does not limit the size of the volume
    size: "10Gi"
    storageClass: "openebs-hostpath"
    # set this to a high number so we dont have to worry about storage limit (50 * 30GB = 1500GB)
    maxVolumes: 50

filer:
  replicas: 3
  nodeSelector: ~
{{- if .ReplaceImages }}
  imageOverride: '{{ ImageString (index .Images "seaweedfs") }}'
{{- end }}
  podAnnotations:
    backup.velero.io/backup-volumes: seaweedfs-filer-log-volume
  affinity: |
    # schedule on control-plane nodes
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
    # schedule on different nodes when possible
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - seaweedfs
            - key: app.kubernetes.io/component
              operator: In
              values:
              - filer
          topologyKey: "kubernetes.io/hostname"
  data:
    type: "persistentVolumeClaim"
    # openebs-hostpath storage does not limit the size of the volume
    size: "1Gi"
    storageClass: "openebs-hostpath"
  logs:
    type: "persistentVolumeClaim"
    # openebs-hostpath storage does not limit the size of the volume
    size: "1Gi"
    storageClass: "openebs-hostpath"
  s3:
    enabled: true
    enableAuth: true
    existingConfigSecret: secret-seaweedfs-s3
    createBuckets:
    - name: registry
      anonymousRead: false
