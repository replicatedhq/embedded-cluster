name: End to End
description: e2e tests for embedded-cluster
inputs:
  test-name:
    description: 'individual test to run'
    required: true
  dr-aws-access-key-id:
    description: 'Disaster Recovery AWS Access Key ID'
    required: true
  dr-aws-secret-access-key:
    description: 'Disaster Recovery AWS Secret Access Key'
    required: true
  k0s-version:
    description: 'k0s version to expect in e2e tests'
    required: true
  k0s-version-previous-1:
    description: 'k0s previous (minor-1) version to expect in e2e tests'
    required: true
  k0s-version-previous-2:
    description: 'k0s previous (minor-2) version to expect in e2e tests'
    required: true
  k0s-version-previous-3:
    description: 'k0s previous (minor-3) version to expect in e2e tests'
    required: true
  k0s-version-previous-stable:
    description: 'k0s previous stable version to expect in e2e tests'
    required: true
  version-specifier:
    description: 'the git sha or tag used to generate application version strings'
    required: true
  github-token:
    description: 'the ci github token used to install the replicated cli'
    required: false # this is only needed for cmx-based tests
  is-lxd:
    description: 'whether the test runs on lxd'
    required: false
    default: 'false'
  cmx-api-token:
    description: 'the token used to access the replicated api for cmx'
    required: false # this is only needed for cmx-based tests
  upgrade-target-ec-version:
    description: 'the embedded cluster version to expect after upgrades complete'
    required: false # this is only set by post-release testing
  airgap-bundles-dir:
    description: 'directory containing verified locally assembled airgap bundles'
    required: false
  dr-fixture-output:
    description: 'path where the validated DR fixture should be exported'
    required: false
  dr-fixture-app-version:
    description: 'exact application version used to produce the DR fixture'
    required: false
  dr-fixture-ec-version:
    description: 'exact released EC version used to produce the DR fixture'
    required: false
  dr-fixture-bundle-sha256:
    description: 'SHA-256 of the exact released bundle used to produce the DR fixture'
    required: false
  dr-fixture-input:
    description: 'path to an immutable DR fixture payload consumed by a restore-only test'
    required: false
  dr-restore-bundle-version:
    description: 'local bundle artifact name used by a restore-only DR test'
    required: false

runs:
  using: composite
  steps:
  - name: Local Setup
    if: ${{ inputs.is-lxd == 'true' }}
    uses: ./.github/actions/e2e-lxd-setup

  - name: CMX Setup
    if: ${{ inputs.is-lxd == 'false' }}
    uses: ./.github/actions/e2e-cmx-setup
    with:
      github-token: ${{ inputs.github-token }}

  - name: Setup Go
    uses: actions/setup-go@v7
    with:
      go-version-file: go.mod
      cache-dependency-path: "**/*.sum"

  - name: Cache pinned MinIO tools
    if: ${{ inputs.test-name == 'TestSingleNodeAirgapDisasterRecovery' || inputs.test-name == 'TestMultiNodeAirgapHADisasterRecovery' }}
    id: minio-tools-cache
    uses: actions/cache@v5
    with:
      path: ${{ runner.temp }}/e2e-minio-tools
      key: e2e-minio-tools-linux-amd64-v1

  - name: Install crane for pinned MinIO tools
    if: ${{ (inputs.test-name == 'TestSingleNodeAirgapDisasterRecovery' || inputs.test-name == 'TestMultiNodeAirgapHADisasterRecovery') && steps.minio-tools-cache.outputs.cache-hit != 'true' }}
    uses: imjasonh/setup-crane@v0.7

  - name: Extract pinned MinIO tools
    if: ${{ (inputs.test-name == 'TestSingleNodeAirgapDisasterRecovery' || inputs.test-name == 'TestMultiNodeAirgapHADisasterRecovery') && steps.minio-tools-cache.outputs.cache-hit != 'true' }}
    shell: bash
    env:
      TOOLS_DIR: ${{ runner.temp }}/e2e-minio-tools
    run: |
      set -euo pipefail
      mkdir -p "$TOOLS_DIR"
      crane export quay.io/minio/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2 - |
        tar -xOf - usr/bin/minio > "$TOOLS_DIR/minio"
      crane export quay.io/minio/mc@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780 - |
        tar -xOf - usr/bin/mc > "$TOOLS_DIR/mc"
      chmod 0755 "$TOOLS_DIR/minio" "$TOOLS_DIR/mc"

  - name: Verify pinned MinIO tools
    if: ${{ inputs.test-name == 'TestSingleNodeAirgapDisasterRecovery' || inputs.test-name == 'TestMultiNodeAirgapHADisasterRecovery' }}
    shell: bash
    env:
      TOOLS_DIR: ${{ runner.temp }}/e2e-minio-tools
    run: |
      set -euo pipefail
      echo '7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  minio' > "$TOOLS_DIR/SHA256SUMS"
      echo '01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891  mc' >> "$TOOLS_DIR/SHA256SUMS"
      (cd "$TOOLS_DIR" && sha256sum --check SHA256SUMS)
      echo "E2E_MINIO_BINARY=$TOOLS_DIR/minio" >> "$GITHUB_ENV"
      echo "E2E_MC_BINARY=$TOOLS_DIR/mc" >> "$GITHUB_ENV"

  - name: E2E
    id: e2e
    shell: bash
    run: |
      export SHORT_SHA=${{ inputs.version-specifier }}
      echo "SHORT_SHA=${SHORT_SHA}"

      export CMX_NODE_NAME="ec-test-suite-$(tr -dc A-Za-z0-9 </dev/urandom | head -c 10)"
      echo "CMX_NODE_NAME=${CMX_NODE_NAME}"
      echo "cmx_node_name=${CMX_NODE_NAME}" >> $GITHUB_OUTPUT

      export REPLICATED_API_TOKEN=${{ inputs.cmx-api-token }}
      export DR_S3_ENDPOINT=https://s3.amazonaws.com
      export DR_S3_REGION=us-east-1
      export DR_S3_BUCKET=embedded-cluster-e2e-snapshots
      export DR_S3_PREFIX=${{ inputs.test-name }}-${{ github.run_id }}-${{ github.run_attempt }}
      export DR_S3_PREFIX_AIRGAP=${{ inputs.test-name }}-${{ github.run_id }}-${{ github.run_attempt }}-airgap
      export DR_ACCESS_KEY_ID=${{ inputs.dr-aws-access-key-id }}
      export DR_SECRET_ACCESS_KEY=${{ inputs.dr-aws-secret-access-key }}
      export EXPECT_K0S_VERSION=${{ inputs.k0s-version }}
      export EXPECT_K0S_VERSION_PREVIOUS_1=${{ inputs.k0s-version-previous-1 }}
      export EXPECT_K0S_VERSION_PREVIOUS_2=${{ inputs.k0s-version-previous-2 }}
      export EXPECT_K0S_VERSION_PREVIOUS_3=${{ inputs.k0s-version-previous-3 }}
      export EXPECT_K0S_VERSION_PREVIOUS_STABLE=${{ inputs.k0s-version-previous-stable }}
      export EXPECT_EMBEDDED_CLUSTER_UPGRADE_TARGET_VERSION=${{ inputs.upgrade-target-ec-version }}
      export E2E_AIRGAP_BUNDLE_DIR=${{ inputs.airgap-bundles-dir }}
      export E2E_DR_FIXTURE_OUTPUT=${{ inputs.dr-fixture-output }}
      export E2E_DR_FIXTURE_APP_VERSION=${{ inputs.dr-fixture-app-version }}
      export E2E_DR_FIXTURE_EC_VERSION=${{ inputs.dr-fixture-ec-version }}
      export E2E_DR_FIXTURE_BUNDLE_SHA256=${{ inputs.dr-fixture-bundle-sha256 }}
      export E2E_DR_FIXTURE_INPUT=${{ inputs.dr-fixture-input }}
      export E2E_DR_RESTORE_BUNDLE_VERSION=${{ inputs.dr-restore-bundle-version }}
      export CMX_SSH_PUBLIC_KEY="$HOME/.ssh/id_rsa.pub"
      export SKIP_LXD_CLEANUP=true
      make e2e-test TEST_NAME=${{ inputs.test-name }}

  - name: Verify DR fixture candidate
    if: ${{ inputs.dr-fixture-output != '' }}
    shell: bash
    env:
      FIXTURE_PAYLOAD: ${{ inputs.dr-fixture-output }}
      FORBID_DR_ACCESS_KEY: ${{ inputs.dr-aws-access-key-id }}
      FORBID_DR_SECRET_KEY: ${{ inputs.dr-aws-secret-access-key }}
      FORBID_CMX_API_TOKEN: ${{ inputs.cmx-api-token }}
      FORBID_GITHUB_TOKEN: ${{ inputs.github-token }}
    run: |
      go run ./cmd/dr-fixture verify \
        --payload "$FIXTURE_PAYLOAD" \
        --manifest "$FIXTURE_PAYLOAD.manifest.json" \
        --forbid-env FORBID_DR_ACCESS_KEY \
        --forbid-env FORBID_DR_SECRET_KEY \
        --forbid-env FORBID_CMX_API_TOKEN \
        --forbid-env FORBID_GITHUB_TOKEN

  - name: Upload validated DR fixture candidate
    if: ${{ inputs.dr-fixture-output != '' }}
    uses: actions/upload-artifact@v7
    with:
      name: embedded-cluster-dr-fixture-candidate
      path: |
        ${{ inputs.dr-fixture-output }}
        ${{ inputs.dr-fixture-output }}.manifest.json
      if-no-files-found: error

  - name: Troubleshoot
    if: ${{ !cancelled() }}
    uses: ./.github/actions/e2e-troubleshoot
    with:
      test-name: ${{ inputs.test-name }}

  - name: Cleanup CMX
    if: ${{ always() }}
    shell: bash
    env:
      REPLICATED_API_TOKEN: ${{ inputs.cmx-api-token }}
    run: |
      replicated vm rm "${{ steps.e2e.outputs.cmx_node_name }}" || true
