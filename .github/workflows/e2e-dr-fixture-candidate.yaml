name: Produce E2E DR fixture candidate

on:
  # Bootstrap the first candidate before this workflow exists on the default
  # branch. Remove this branch-specific trigger after the candidate is audited.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/e2e-dr-fixture-candidate.yaml
      - .github/actions/e2e/action.yml
      - e2e/dr_fixture.go
      - e2e/dr_fixture_test.go
      - e2e/restore_test.go
      - e2e/cluster/cmx/cluster.go
  workflow_dispatch:
    inputs:
      baseline_ec_version:
        description: Exact released EC version used to produce the fixture
        required: true
        default: 2.19.8+k8s-1.35
        type: string

permissions:
  actions: read
  contents: read

jobs:
  produce-and-restore:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'divolgin/no-airgap-build' }}
    runs-on: ubuntu-22.04
    concurrency:
      group: e2e-dr-fixture-candidate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      BASELINE_EC_VERSION: ${{ inputs.baseline_ec_version || '2.19.8+k8s-1.35' }}
      EC_RUNTIME_CACHE_BUCKET: dev-embedded-cluster-bin
      AWS_ACCESS_KEY_ID: ${{ secrets.DEV_EMBEDDED_CLUSTER_UPLOAD_IAM_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_EMBEDDED_CLUSTER_UPLOAD_IAM_SECRET }}
      AWS_REGION: us-east-1
      REPLICATED_API_TOKEN: ${{ secrets.STAGING_REPLICATED_API_TOKEN }}
      STANDARD_LICENSE_ID: 2eAqdricgviUeki42j02nIn1ayl
      SNAPSHOT_LICENSE_ID: 2gEzHseTJQ4z2Axwj7KK9RYt4oT
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/*.sum"

      - uses: azure/setup-helm@v4

      - uses: imjasonh/setup-crane@v0.7

      - name: Install Replicated CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo replicatedhq/replicated --pattern '*linux_amd64.tar.gz' --output replicated.tar.gz
          tar xf replicated.tar.gz replicated
          sudo mv replicated /usr/local/bin/replicated

      - name: Download released baseline binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p output/bin
          gh release download "$BASELINE_EC_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern embedded-cluster-linux-amd64.tgz
          tar -xzf embedded-cluster-linux-amd64.tgz -C output/bin embedded-cluster
          chmod 0755 output/bin/embedded-cluster

      - name: Assemble released baseline bundle
        env:
          ROLE: previous-stable
          RELEASE_YAML_DIR: e2e/kots-release-install-stable
          EC_BINARY: output/bin/embedded-cluster
          APP_VERSION: appver-airgap-e2e-previous-stable
        run: ./scripts/assemble-e2e-airgap-bundle.sh

      - name: Inspect released baseline bundle
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find output/e2e-airgap-bundles/snapshot -type f -name 'appver-*-previous-stable.tgz')
          if [ "${#bundles[@]}" -ne 1 ]; then
            printf 'expected exactly one previous-stable bundle, found %d\n' "${#bundles[@]}" >&2
            printf '%s\n' "${bundles[@]}" >&2
            exit 1
          fi
          bundle=${bundles[0]}
          test -s "$bundle"
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          tar -xzf "$bundle" -C "$workdir"
          application_bundle=$(find "$workdir" -maxdepth 1 -name '*.airgap' -type f -print -quit)
          test -n "$application_bundle"
          tar -xOf "$application_bundle" embedded-cluster/version-metadata.json > "$workdir/metadata.json"
          ec_version=$(jq -er .Versions.Installer "$workdir/metadata.json")
          k0s_version=$(jq -er .Versions.Kubernetes "$workdir/metadata.json")
          app_version=$(basename "$bundle" .tgz)
          bundle_sha256="sha256:$(sha256sum "$bundle" | awk '{print $1}')"
          echo "Released fixture baseline: app $app_version, EC $ec_version, k0s $k0s_version"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "ec_version=$ec_version" >> "$GITHUB_OUTPUT"
          echo "k0s_version=$k0s_version" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$bundle_sha256" >> "$GITHUB_OUTPUT"

      - name: Produce fixture and prove it restores
        uses: ./.github/actions/e2e
        with:
          test-name: TestMultiNodeAirgapHADisasterRecovery
          dr-aws-access-key-id: ${{ secrets.TESTIM_AWS_ACCESS_KEY_ID }}
          dr-aws-secret-access-key: ${{ secrets.TESTIM_AWS_SECRET_ACCESS_KEY }}
          k0s-version: ${{ steps.baseline.outputs.k0s_version }}
          k0s-version-previous-1: ${{ steps.baseline.outputs.k0s_version }}
          k0s-version-previous-2: ${{ steps.baseline.outputs.k0s_version }}
          k0s-version-previous-3: ${{ steps.baseline.outputs.k0s_version }}
          k0s-version-previous-stable: ${{ steps.baseline.outputs.k0s_version }}
          version-specifier: airgap-e2e
          github-token: ${{ github.token }}
          cmx-api-token: ${{ secrets.CMX_REPLICATED_API_TOKEN }}
          airgap-bundles-dir: ${{ github.workspace }}/output/e2e-airgap-bundles
          dr-fixture-output: ${{ github.workspace }}/output/dr-fixture/minio-data.tar.gz
          dr-fixture-app-version: ${{ steps.baseline.outputs.app_version }}
          dr-fixture-ec-version: ${{ steps.baseline.outputs.ec_version }}
          dr-fixture-bundle-sha256: ${{ steps.baseline.outputs.bundle_sha256 }}

      - name: Publish immutable fixture
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DEV_EMBEDDED_CLUSTER_UPLOAD_IAM_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_EMBEDDED_CLUSTER_UPLOAD_IAM_SECRET }}
          AWS_REGION: us-east-1
          BUCKET: dev-embedded-cluster-bin
          PAYLOAD: ${{ github.workspace }}/output/dr-fixture/minio-data.tar.gz
        run: |
          set -euo pipefail
          manifest="$PAYLOAD.manifest.json"
          digest=$(jq -er '.payloadSHA256 | select(startswith("sha256:"))' "$manifest")
          object_prefix="ec-v2-dr-fixtures/v1/${digest#sha256:}"
          publish() {
            local file=$1 key=$2 sha
            sha=$(sha256sum "$file" | awk '{print $1}')
            if existing=$(aws s3api head-object --bucket "$BUCKET" --key "$key" --query 'Metadata.sha256' --output text 2>/dev/null); then
              if [ "$existing" != "$sha" ]; then
                echo "immutable fixture object has unexpected digest: s3://$BUCKET/$key" >&2
                exit 1
              fi
              echo "reusing immutable fixture object s3://$BUCKET/$key"
              return
            fi
            aws s3 cp "$file" "s3://$BUCKET/$key" --metadata "sha256=$sha" --only-show-errors
          }
          for file in "$PAYLOAD" "$manifest"; do
            key="$object_prefix/$(basename "$file")"
            publish "$file" "$key"
          done
          {
            echo "### Published DR fixture"
            echo
            echo "- Digest: \`$digest\`"
            echo "- Payload: \`https://$BUCKET.s3.amazonaws.com/$object_prefix/minio-data.tar.gz\`"
            echo "- Manifest: \`https://$BUCKET.s3.amazonaws.com/$object_prefix/minio-data.tar.gz.manifest.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
