name: Release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create Kubernetes release tags
        id: versions
        env:
          APP_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid app release tag: $APP_VERSION"
            exit 1
          fi
          versions='[]'
          for minor in $(make print-SUPPORTED_K0S_MINOR_VERSIONS); do
            version="${APP_VERSION%%-*}+k8s-1.${minor}"
            if [[ "$APP_VERSION" == *-* ]]; then
              version="${version}-${APP_VERSION#*-}"
            fi
            # Allow reruns, but never move an existing release tag.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" > /dev/null 2>&1; then
              commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$version" --jq .sha)
              if [[ "$commit" != "$GITHUB_SHA" ]]; then
                echo "Tag $version already exists at a different commit"
                exit 1
              fi
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$version" -f sha="$GITHUB_SHA"
            fi
            versions=$(jq -c --arg version "$version" '. + [$version]' <<< "$versions")
          done
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    uses: ./.github/workflows/release-k8s.yaml
    with:
      version: ${{ matrix.version }}
    secrets: inherit

  generate-ec-release-notes-pr:
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check if tag is from main branch
        id: check-main
        run: |
          # Get the commit that the tag points to
          TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref }})

          # Check if this commit is an ancestor of the main branch (or the same commit)
          if git merge-base --is-ancestor $TAG_COMMIT origin/main; then
            echo "Tag was created from main branch"
            echo "is_from_main=true" >> $GITHUB_OUTPUT
          else
            echo "Tag was NOT created from main branch"
            echo "is_from_main=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine previous release
        if: steps.check-main.outputs.is_from_main == 'true'
        id: previous-release
        uses: ./.github/actions/previous-release
        with:
          version: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Depot CLI
        if: steps.check-main.outputs.is_from_main == 'true'
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1

      - name: Generate EC Release Notes PR
        if: steps.check-main.outputs.is_from_main == 'true'
        env:
          GIT_TAG: ${{ github.ref_name }}
          BASE_VERSION: ${{ steps.previous-release.outputs.base-version }}
          DEPOT_TOKEN: ${{ secrets.DEPOT_CI_DISPATCH_TOKEN }}
        run: |
          depot ci dispatch \
            --repo replicatedhq/replicated-docs \
            --workflow release-notes.yml \
            --ref main \
            --input event_type=embedded-cluster-release-notes \
            --input version="${GIT_TAG}" \
            --input prev_version="${BASE_VERSION}" \
            --input dry_run=false
