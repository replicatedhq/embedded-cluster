contents:
  repositories:
    - https://apk.cve0.io
    - ./packages/
  keyring:
    - https://apk.cve0.io/key/cve0-signing.rsa.pub
    - ./melange.rsa.pub
  packages:
    - ca-certificates-bundle
    - local-artifact-mirror  # This is expected to be built locally by `melange`.

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  # many embedded-cluster commands must be run as root
  run-as: 0

environment:
  VERSION: ${PACKAGE_VERSION}

entrypoint:
  command: /usr/bin/local-artifact-mirror
