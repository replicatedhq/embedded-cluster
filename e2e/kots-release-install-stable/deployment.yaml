apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: example
    component: nginx
    replicated.com/disaster-recovery: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example
      component: nginx
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: fixture-data
      labels:
        app: example
        component: nginx
    spec:
      containers:
        - name: nginx
          image: us-east4-docker.pkg.dev/replicated-qa/ec-smoke-test/nginx:1.24-alpine
          resources:
            limits:
              memory: '64Mi'
              cpu: '50m'
          env:
            - name: APP_SEQUENCE
              value: "{{repl Cursor }}"
            - name: APP_VERSION
              value: "{{repl VersionLabel }}"
            - name: APP_CHANNEL
              value: "{{repl ChannelName }}"
            - name: CONFIG_HOSTNAME
              value: '{{repl ConfigOption "hostname" }}'
            - name: CONFIG_PASSWORD
              value: '{{repl ConfigOption "pw" }}'
          volumeMounts:
            - name: fixture-data
              mountPath: /var/lib/dr-fixture
      volumes:
        - name: fixture-data
          persistentVolumeClaim:
            claimName: dr-fixture-data
